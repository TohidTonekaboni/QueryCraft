
services:
  app:
    build:
      args:
        BASE_IMAGE: nvidia/cuda:12.4.1-devel-ubuntu22.04
        WITH_LOCAL_LLM: "1"
        LLAMA_CMAKE_ARGS: "-DGGML_CUDA=on"
    environment:
      SQL_BACKEND: local
      SQL_N_GPU_LAYERS: "-1"   # SQLCoder fully on the GPU
      GEMMA_BACKEND: local
      GEMMA_N_GPU_LAYERS: "0"  # Gemma stays on CPU so two models never share GPU memory
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
