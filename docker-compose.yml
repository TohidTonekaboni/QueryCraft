x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"   # rotate container logs so they cannot fill the disk
    max-file: "5"

services:
  postgres:
    image: postgres:16
    container_name: querycraft-postgres
    logging: *default-logging
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: querycraft-ingestion
    logging: *default-logging
    env_file: .env
    environment:
      POSTGRES_HOST: postgres 
      POSTGRES_PORT: "5432"    
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        WITH_LOCAL_LLM: "0"
    container_name: querycraft-app
    logging: *default-logging
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9100:9100"  # Prometheus metrics (internal; not part of the public API)
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SQL_MODEL_DIR: /models
      METRICS_ADDR: 0.0.0.0  # inside the container; the port is published on localhost only (above)
    volumes:
      - ./models:/models:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"  
    depends_on:
      ingestion:
        condition: service_completed_successfully  # creates tables, seed data and the read-only role

volumes:
  postgres_data:
